[package]
name = "desktop-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
platform-security = { path = "../../../crates/platform-security" }
futures-util.workspace = true
tokio-tungstenite.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
url = "2.5.8"
tempfile = "3"
rfd = "0.15.4"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2.10.1"
base64 = "0.22"
minisign-verify = "0.2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_WindowsProgramming", "Win32_Graphics_Dwm"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
