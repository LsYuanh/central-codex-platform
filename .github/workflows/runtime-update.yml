name: Validate stable App Server
on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Stable App Server version (empty discovers latest)
        type: string
        default: '0.159.2'
      publish:
        description: Publish after validation (requires configured signing environment)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: runtime-stable
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || vars.RUNTIME_AUTO_UPDATE_ENABLED == 'true'
    uses: ./.github/workflows/runtime-validate.yml
    with:
      upstream_version: ${{ inputs.upstream_version || '' }}
      retain_candidate: >-
        ${{ github.repository == 'LsYuanh/central-codex-platform' &&
          github.event.repository.private == false &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          vars.RUNTIME_PUBLISH_ENABLED == 'true' &&
          (inputs.publish == true || github.event_name == 'schedule') }}
  publish:
    needs: validate
    # Public downloads and a reviewed default-branch workflow are required before
    # the protected environment can release its key. No PR or trial branch signs.
    if: >-
      needs.validate.outputs.status == 'validated' &&
      github.repository == 'LsYuanh/central-codex-platform' &&
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.RUNTIME_PUBLISH_ENABLED == 'true' &&
      (inputs.publish == true || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: runtime-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: runtime-candidate
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Sign and publish only a validated candidate
        run: node scripts/release/publish-runtime-update.mjs candidate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.RUNTIME_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
