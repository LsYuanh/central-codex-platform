name: Runtime Mac trial

on:
  # Bootstrap the trial without merging unpublished product work into main.
  push:
    branches: [codex/runtime-hosted-mac-trial]
    paths:
      - .github/workflows/runtime-trial.yml
      - scripts/release/build-runtime-update.mjs
      - harness/check-upstream.mjs
      - harness/check-runtime-schema.mjs
      - harness/remote-workspace.patch
      - harness/upstream.json
      - harness/schema/reviews/**
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Official stable App Server version to validate
        type: string
        required: true
        default: '0.159.2'

# This workflow has no signing environment, secrets, release job or write permission.
permissions:
  contents: read
concurrency:
  group: runtime-mac-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trial:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUNTIME_TRIAL_VERSION: ${{ inputs.upstream_version || '0.159.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify host and record initial resources
        run: |
          echo "RUNTIME_TRIAL_OUTPUT=$RUNNER_TEMP/runtime-trial-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          node --version
          sysctl -n hw.memsize hw.logicalcpu
          df -h "$RUNNER_TEMP"
          rustup --version
          xcode-select -p
      - name: Build gateway and run trial regression
        run: |
          npm ci
          npm run build --workspace @central-codex-spike/agentrpc-types
          npm run build --workspace @central-codex-spike/central-gateway
          node --test tests/smoke/runtime-trial.test.mjs
      - name: Validate the selected App Server without signing or publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          NODE_LICENSE="$(node -p 'require("node:path").resolve(process.execPath,"../../LICENSE")')"
          node scripts/release/build-runtime-update.mjs "$RUNTIME_TRIAL_OUTPUT" "$NODE_LICENSE" "$RUNTIME_TRIAL_VERSION"
      - name: Record final disk usage
        if: always()
        run: df -h "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-trial-report
          # Only diagnostics leave the builder; no unsigned installation package.
          path: |
            ${{ env.RUNTIME_TRIAL_OUTPUT }}/report.json
            ${{ env.RUNTIME_TRIAL_OUTPUT }}/schema-changes.json
            ${{ env.RUNTIME_TRIAL_OUTPUT }}/upstream/upstream-report.json
            ${{ env.RUNTIME_TRIAL_OUTPUT }}/upstream/patch-conflicts.txt
          retention-days: 3
          if-no-files-found: warn
