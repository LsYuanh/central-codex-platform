name: Runtime Mac trial

on:
  # Bootstrap privately without enabling default-branch releases.
  push:
    branches: [codex/runtime-hosted-mac-trial]
    paths:
      - .github/workflows/runtime-trial.yml
      - .github/workflows/runtime-update.yml
      - .github/workflows/runtime-validate.yml
      - scripts/release/build-runtime-update.mjs
      - scripts/release/runtime-release-artifact.mjs
      - tests/smoke/runtime-release.test.mjs
      - harness/check-upstream.mjs
      - harness/check-runtime-schema.mjs
      - harness/remote-workspace.patch
      - harness/upstream.json
      - harness/schema/reviews/**
      - harness/adaptations/**
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Official stable App Server version to validate
        type: string
        required: true
        default: '0.159.2'

permissions:
  contents: read
concurrency:
  group: runtime-mac-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Exercise the release pipeline without inherited secrets or publication.
  trial:
    uses: ./.github/workflows/runtime-validate.yml
    with:
      upstream_version: ${{ inputs.upstream_version || '0.159.2' }}
      retain_candidate: false
