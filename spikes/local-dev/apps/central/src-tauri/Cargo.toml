[package]
name = "central-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
url = "2"
tempfile = "3"
rfd = "0.15.4"
platform-security = { path = "../../../crates/platform-security" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
zeroize = "1"
base64 = "0.22"
der = "0.7.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-manual-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
