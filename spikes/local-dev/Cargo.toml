[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/local-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
