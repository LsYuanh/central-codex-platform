[package]
name = "local-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
platform-security = { path = "../platform-security" }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
base64 = "0.22.1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
dirs = "6"
sha2 = "0.10"
tempfile = "3"
codex-patch-core = { path = "vendor/codex-patch-core" }
office_oxide = "0.1.15"
pdfium-render = "0.9.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
