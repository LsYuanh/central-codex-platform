[package]
name = "peer-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
futures-util.workspace = true
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio.workspace = true
serde.workspace = true
url = "2"
zeroize = "1"
n0-watcher = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
# Unstable diagnostics are confined to probes/tests and pinned to the audited version.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "unstable-net-report", "metrics"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde_json.workspace = true
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
