[package]
name = "platform-security"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
peer-transport = { path = "../peer-transport" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
ed25519-dalek = "2"
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
url = "2"
rsa = "0.9"
rand = "0.8"
zeroize = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
minisign-verify = "0.2.5"
reqwest-updater = { package = "reqwest", version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
anyhow = "1"
tempfile = "3"
futures-util.workspace = true
